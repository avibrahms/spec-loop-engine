version: 1
name: system0-plan
workspace: /Users/avi/Documents/Projects/system0-natural
vars:
  model: gpt-5.4
  execute_effort: high
  verify_effort: medium
  max_attempts: 5
defaults:
  max_attempts: ${max_attempts}
  runner:
    type: codex_exec
    codex_bin: /Applications/Codex.app/Contents/Resources/codex
    model: ${model}
    reasoning_effort: ${execute_effort}
    sandbox: danger-full-access
    skip_git_repo_check: true
    git_finalize_retries: 2
    add_dirs:
    - /Users/avi/Documents/Projects/system0-natural
  verifier:
    type: codex_exec
    codex_bin: /Applications/Codex.app/Contents/Resources/codex
    model: ${model}
    reasoning_effort: ${verify_effort}
    sandbox: workspace-write
    skip_git_repo_check: true
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Users/avi/.local/bin:/Applications/Codex.app/Contents/Resources
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: ${attempt_dir}/verifier-tmp
      TMP: ${attempt_dir}/verifier-tmp
      TEMP: ${attempt_dir}/verifier-tmp
      XDG_CACHE_HOME: ${attempt_dir}/verifier-cache
    add_dirs:
    - /Users/avi/Documents/Projects/system0-natural
phases:
- id: phase-00-prerequisites
  title: Prerequisites
  vars:
    phase_plan: /Users/avi/Documents/Projects/system0-natural/plan/phase-00-prerequisites/PLAN.md
  run:
    reasoning_effort: medium
    prompt: 'Execute the System Zero phase defined in `/Users/avi/Documents/Projects/system0-natural/plan/phase-00-prerequisites/PLAN.md`.


      Treat these files as the source of truth before you change anything:

      - `/Users/avi/Documents/Projects/system0-natural/plan/README.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/EXECUTION_RULES.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/PROTOCOL_SPEC.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/ARCHITECTURE.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/phase-00-prerequisites/PLAN.md`


      Phase title: Prerequisites


      Required behavior:

      - Follow the phase plan literally.

      - Canonical git policy for this spec: current-branch checkpoint mode.

      - Never create, switch, rename, or delete git branches.

      - Stay on the current branch for the entire run.

      - If a phase plan asks for branch operations, merge steps, or exact one-commit
      branch rules, treat that language as overridden by this spec and continue in
      current-branch checkpoint mode instead.

      - Perform the actual implementation, execution, testing, and verification the
      phase requires.

      - If prior verifier feedback exists, read it first and fix every issue before
      doing anything else.

      - Do not return success while the git worktree is dirty, while uncommitted or
      untracked phase residue remains, or while the current-branch checkpoint commit(s)
      for this phase are still missing.

      - Stop only when this phase is genuinely ready for independent verification,
      or when an external blocker prevents progress.

      - Do not drift into later phases.


      In `summary`, say what is now complete.

      In `artifacts`, list the most important files changed.

      In `resume_hint`, give the exact next move if another executor has to continue
      from here.

      '
  verify:
    reasoning_effort: low
    prompt: 'Audit the just-finished System Zero phase defined in `/Users/avi/Documents/Projects/system0-natural/plan/phase-00-prerequisites/PLAN.md`.


      Treat these files as the source of truth:

      - `/Users/avi/Documents/Projects/system0-natural/plan/README.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/EXECUTION_RULES.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/PROTOCOL_SPEC.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/ARCHITECTURE.md`

      - `/Users/avi/Documents/Projects/system0-natural/plan/phase-00-prerequisites/PLAN.md`


      Phase title: Prerequisites


      Verification requirements:

      - Independently verify the acceptance criteria and the concrete outputs promised
      by the phase plan.

      - Canonical git policy for this spec: current-branch checkpoint mode.

      - Treat any git branch creation, switching, renaming, or deletion as a failure
      against this spec.

      - Do not require phase branches, phase merges, or exact one-commit branch counts
      even if stale plan text still mentions them.

      - Require a clean current branch with the phase checkpoint commit(s) already
